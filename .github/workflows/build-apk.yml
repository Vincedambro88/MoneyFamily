name: Build MoneyFamily APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Excel template download to Insert screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/moneyfamily/app/MainActivity.kt')
          s = p.read_text()
          # Remove duplicate import safely.
          line = 'import androidx.activity.result.contract.ActivityResultContracts'
          lines = s.splitlines(True)
          out=[]; seen=False
          for x in lines:
              if x.strip()==line:
                  if seen: continue
                  seen=True
              out.append(x)
          s=''.join(out)
          if 'val templateLauncher=rememberLauncherForActivityResult' not in s:
              needle = ' val launcher=rememberLauncherForActivityResult(ActivityResultContracts.OpenDocument())'
              pos=s.find(needle)
              if pos<0: raise SystemExit('Excel import launcher not found')
              line_end=s.find('\n',pos)
              # Keep the existing launcher intact and insert a CreateDocument launcher after it.
              s=s[:line_end+1] + ' val templateLauncher=rememberLauncherForActivityResult(ActivityResultContracts.CreateDocument("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")){uri->if(uri!=null)scope.launch{runCatching{ExcelTemplate.write(context,uri);status="Modello Excel salvato"}.onFailure{status="Errore salvataggio: ${it.message?:"operazione non riuscita"}"}}}\n' + s[line_end+1:]
          if 'Text("Scarica modello Excel")' not in s:
              needle='OutlinedButton(onClick={launcher.launch(arrayOf("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet","application/vnd.ms-excel","text/csv"))},modifier=Modifier.fillMaxWidth()){Text("Importa da Excel")}';
              if needle not in s: raise SystemExit('Importa da Excel button not found')
              button='OutlinedButton(onClick={templateLauncher.launch("MoneyFamily_Modello_Importazione.xlsx")},modifier=Modifier.fillMaxWidth()){Text("Scarica modello Excel")};'
              s=s.replace(needle, button+needle, 1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- app/src/main/java/com/moneyfamily/app/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/moneyfamily/app/MainActivity.kt
            git commit -m "Add Excel template download button"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release AAB
        run: gradle --no-daemon bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFamily-1.0.0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
