name: Build MoneyFamily APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix dashboard source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/moneyfamily/app/MainActivity.kt')
          s = p.read_text()
          if 'import androidx.compose.ui.draw.clip' not in s:
              s = s.replace('import androidx.compose.ui.Modifier\n', 'import androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.clip\n')
          s = s.replace('values.maxOf{abs(it.second)}', 'values.maxOf{kotlin.math.abs(it.second)}')
          p.write_text(s)
          PY
          git diff --check

      - name: Persist source fix
        run: |
          if ! git diff --quiet -- app/src/main/java/com/moneyfamily/app/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/moneyfamily/app/MainActivity.kt
            git commit -m "Fix dashboard chart compilation"
            git push origin HEAD:main
          fi

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyFamily-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

# Build trigger for the corrected dashboard source
