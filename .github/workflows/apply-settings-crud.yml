name: Apply Settings CRUD Patch

on:
  push:
    paths:
      - 'tools/patch_settings_crud.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply settings CRUD patch
        run: python3 tools/patch_settings_crud.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/moneyfamily/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Add edit and delete controls to settings"
          git push
