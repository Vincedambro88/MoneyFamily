name: Apply Dashboard Patch

on:
  push:
    paths:
      - 'tools/patch_dashboard.py'
      - 'tools/patch_import_back.py'
      - 'tools/patch_summary_lists.py'
      - 'tools/patch_pie_legend_scroll.py'
      - '.github/workflows/apply-dashboard-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply dashboard patch
        run: python3 tools/patch_dashboard.py
      - name: Apply Excel import back patch
        run: python3 tools/patch_import_back.py
      - name: Apply complete summary lists patch
        run: python3 tools/patch_summary_lists.py
      - name: Make pie chart legends scrollable
        run: python3 tools/patch_pie_legend_scroll.py
      - name: Force remove display limits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/moneyfamily/app/MainActivity.kt')
          s = p.read_text()
          s2 = s.replace('nonZero.take(10).forEachIndexed{index,entry->','nonZero.forEachIndexed{index,entry->')
          s2 = s2.replace('values.take(12).forEach{(n,v)->BarChartRow(n,v,maxAbs)}','values.forEach{(n,v)->BarChartRow(n,v,maxAbs)}')
          if s2 != s:
              p.write_text(s2)
          PY
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/moneyfamily/app/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Show all category and type summary entries"
          git push
